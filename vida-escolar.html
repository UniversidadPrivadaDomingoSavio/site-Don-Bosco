<!doctype html>
<html lang="es">
  <head>
    <!-- Metadatos, tipografías y hojas de estilo de esta página. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vida escolar · Colegio Don Bosco</title>
    <meta
      name="description"
      content="Colegio Don Bosco Central, Santa Cruz de la Sierra."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/vida-escolar.css" />
    <!-- Datos editables, componentes dinámicos y lógica compartida. -->
    <script src="js/contenido.js" defer></script>
    <script src="js/componentes.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <!-- Encabezado compartido: se carga desde partials/header.html. -->
    <div id="header-placeholder"></div>
    <main>
      <!-- Sección: contenido. -->
      <section class="banner">
        <div class="img" role="img" aria-label="Comunidad educativa"></div>
        <div class="wrap">
          <h1>Vida escolar</h1>
          <div class="orn">
            <i> </i>
            <b> </b>
            <i> </i>
          </div>
        </div>
        <div class="gold-line"></div>
      </section>
      <!-- Sección: contenido. -->
      <section class="sec bg-cream">
        <div class="wrap">
          <div class="head">
            <div class="eyebrow">Nuestra comunidad</div>
            <h2>Aprender también es vivir</h2>
            <p>
              Un espacio para descubrir talentos, compartir experiencias y
              crecer en comunidad.
            </p>
            <div class="orn">
              <i> </i>
              <b> </b>
              <i> </i>
            </div>
          </div>
          <!-- Las tarjetas y sus contenidos se editan en VIDA_ESCOLAR, dentro de js/contenido.js. -->
          <div class="school-grid" id="actividades-escolares"></div>
        </div>
      </section>
      <!-- Modal reutilizable: JavaScript coloca imagen, título y glosa de cada actividad. -->
      <dialog
        class="school-dialog"
        id="modal-actividad"
        aria-labelledby="modal-titulo"
        aria-describedby="modal-descripcion"
      >
        <button
          type="button"
          class="school-dialog-close"
          aria-label="Cerrar detalle"
        >
          ×
        </button>
        <img class="school-dialog-image" alt="" />
        <div class="school-dialog-body">
          <span class="school-dialog-label">VIDA ESCOLAR</span>
          <h2 id="modal-titulo"></h2>
          <p id="modal-descripcion"></p>
        </div>
      </dialog>
    </main>
    <!-- Pie compartido: se carga desde partials/footer.html. -->
    <div id="footer-placeholder"></div>
  </body>
</html>
